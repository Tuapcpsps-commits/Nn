name: Build FoldFlow Honor APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unzip project
        run: |
          unzip FoldFlowHonor_GitHub_v0.3.zip
          ls -la

      - name: Build APK
        working-directory: FoldFlowHonor
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldFlowHonor-APK
          path: FoldFlowHonor/app/build/outputs/apk/debug/app-debug.apk
